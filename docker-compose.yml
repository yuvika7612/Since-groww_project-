services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: since
      POSTGRES_USER: since
      POSTGRES_PASSWORD: since
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U since"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://since:since@postgres/since
      REDIS_URL: redis://redis:6379
      MARKET_PROVIDER: replay
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Seed and fixture run before the server because the replay provider reads
    # the fixture at import time: an empty file means a virtual clock starting
    # at wall time, and every scenario would land outside the session.
    command: >
      sh -c "python scripts/seed.py &&
             python scripts/record_fixture.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:

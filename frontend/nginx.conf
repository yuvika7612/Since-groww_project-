server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }

    # SSE needs its own block and it is not optional. nginx buffers proxied
    # responses by default, so without proxy_buffering off the stream is held
    # until the buffer fills or the connection closes -- the frontend receives
    # nothing, which is indistinguishable from the stream being broken, and it
    # works perfectly in dev where there is no nginx in the path.
    location /api/stream {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # /health sits outside /api on the backend, and the frontend reads it to
    # decide whether the replay scenario panel should exist at all.
    location /health {
        proxy_pass http://api:8000/health;
    }
}
